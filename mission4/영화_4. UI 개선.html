<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <style>
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6;  }
    main { width:min(100% - 32px,860px); margin:32px auto 48px; }
    header { display:flex; align-items:start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(26px,5vw,34px); line-height:1.25; letter-spacing:-.03em; }
    .sub { margin:10px 0 0; color:var(--muted); max-width:46ch; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:20px; }
    .tools input { min-width:0; flex:1 1 160px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; }
    button { font:inherit; cursor:pointer; }
    .tools button { padding:10px 15px; border:1px solid var(--green); border-radius:12px; font-weight:700; background:var(--green); color:#fff; }
    .tools .reset, .tools .toggle { color:var(--green); background:#fff; }
    .tools .toggle[aria-expanded="true"] { background:var(--sage); }
    .search { display:flex; width:100%; margin-top:10px; }
    .search input { min-width:0; flex:1 1 auto; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; background:#fff; }
    #search-result { min-height:22px; margin:6px 0 0; font-size:14px; color:var(--muted); overflow-wrap:anywhere; }
    #summary { margin:14px 0 0; font-size:15px; font-weight:700; color:var(--ink); overflow-wrap:anywhere; }
    #message { min-height:26px; margin:4px 0 14px; font-size:14px; color:var(--muted); }
    .tiers { display:grid; gap:10px; }
    .row { display:flex; min-height:90px; background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    .label { width:64px; flex-shrink:0; border:0; color:white; font-size:26px; font-weight:800; padding:12px 4px; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    .drop { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:9px; padding:12px; min-height:88px; }
    .pool { margin-top:22px; }
    .pool-head { margin:0 0 8px; border:0; padding:0; background:transparent; color:var(--muted); font-size:17px; font-weight:700; text-align:left; }
    #pool { border:1.5px dashed var(--line); border-radius:14px; background:#fff; }
    .cell { width:98px; display:flex; flex-direction:column; gap:4px; }
    .cell.editing { width:min(220px,100%); }
    .card { width:100%; min-height:62px; padding:8px; border:1px solid transparent; border-radius:10px; font-size:14px; font-weight:650; line-height:1.35; overflow-wrap:anywhere; color:var(--ink); cursor:grab; }
    .cell.editing .card { width:98px; }
    .card[aria-pressed="true"] { outline:3px solid var(--green); outline-offset:2px; }
    .memo, .memo-add { display:block; width:100%; margin:0; padding:2px 3px; border:0; border-radius:6px; background:transparent; font:inherit; font-size:12px; line-height:1.35; text-align:left; overflow-wrap:anywhere; cursor:pointer; }
    .memo { font-weight:500; color:#3f473d; }
    .memo-add { font-weight:500; color:var(--muted); }
    .memo:hover, .memo-add:hover { background:var(--sage); }
    .memo-text { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; }
    .memo.expanded .memo-text { display:block; -webkit-line-clamp:unset; line-clamp:unset; }
    .memo-toggle { align-self:flex-start; margin:0; padding:0 3px; border:0; background:transparent; font-size:11px; line-height:1.3; color:var(--green); text-decoration:underline; cursor:pointer; }
    .search-opt { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:14px; color:var(--muted); cursor:pointer; }
    .search-opt input { width:16px; height:16px; margin:0; accent-color:var(--green); }
    .memo-input { width:100%; min-width:0; border:1.5px solid var(--green); border-radius:8px; padding:5px 7px; font:inherit; font-size:13px; background:#fff; }
    .memo-count { display:block; padding-right:3px; font-size:11px; line-height:1.3; text-align:right; color:var(--muted); }
    .memo-count.full { color:#a55239; font-weight:700; }
    .count { display:block; font-size:14px; font-weight:600; }
    .note { font-size:13px; color:var(--muted); margin-top:18px; }
    :focus-visible { outline:3px solid #ba613a; outline-offset:3px; }
    @media(max-width:420px) { .label { width:48px; } .cell { width:90px; } .cell.editing { width:min(220px,100%); } .cell.editing .card { width:90px; } .drop { padding:10px; gap:8px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>내 영화 티어리스트</h1><p class="sub">영화를 선택한 뒤 옮길 등급 글자를 눌러 주세요. 카드를 끌어서 놓아도 됩니다. 카드 아래의 ‘+ 메모’를 누르면 한 줄 메모를 달 수 있어요. 카드에 포커스를 두고 F2 키를 눌러도 됩니다.</p></div></header>
    <form class="tools" id="add-form">
      <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
      <button type="submit">추가</button>
      <button type="button" class="toggle" id="search-toggle" aria-expanded="false" aria-controls="search-panel">검색</button>
      <button type="button" class="toggle" id="export-copy">목록 복사</button>
      <button type="button" class="toggle" id="export-save">txt 저장</button>
      <button type="button" class="reset" id="reset">처음으로</button>
    </form>
    <div id="search-panel" hidden>
      <div class="search">
        <input id="search" type="search" aria-label="제목으로 영화 찾기" placeholder="제목으로 영화 찾기" maxlength="80" autocomplete="off">
      </div>
      <label class="search-opt"><input type="checkbox" id="search-memo"> 메모도 검색</label>
      <p id="search-result" aria-live="polite"></p>
    </div>
    <p id="summary" aria-live="polite"></p>
    <p id="message" role="status">영화를 선택해 S·A·B·C로 나누어 보세요.</p>
    <section class="tiers" id="tiers" aria-label="영화 등급"></section>
    <section class="pool" aria-label="아직 안 정한 영화">
      <button class="pool-head" id="pool-label" type="button" aria-label="미분류로 옮기기">아직 안 정한 영화</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>
    <p class="note">같은 브라우저에서 이 파일을 다시 열면 정리한 목록이 남습니다. 다른 사람에게 파일을 보내도 내 입력 내역까지 전달되지는 않습니다.</p>
  </main>
  <script>
    const KEY = "codyssey-activity-04-v2";
    const LEVELS = ['S', 'A', 'B', 'C', 'pool'];
    const TITLES = ["기생충","인터스텔라","라라랜드","센과 치히로의 행방불명","어벤져스: 엔드게임","범죄도시","타이타닉","토이 스토리"];
    const COLORS = ["#f2e6dc","#e3eee7","#ede7f6","#fcefd9","#e2ecf4","#f6e3e3"];
    const initial = () => ({ nextId: TITLES.length + 1, items: TITLES.map((title,index) => ({ id: 'm' + (index + 1), title, tier: 'pool' })) });
    let state = initial();
    let selected = null;
    let query = '';
    let editingId = null;
    let editDraft = '';
    let searchMemo = false;
    const expandedIds = new Set();
    try {
      const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (stored && Number.isSafeInteger(stored.nextId) && Array.isArray(stored.items)
          && stored.items.every(item => typeof item.id === 'string' && typeof item.title === 'string' && LEVELS.includes(item.tier)
            && (item.memo === undefined || typeof item.memo === 'string'))) state = stored;
    } catch {}

    /* 드래그 중 화면 위·아래 가장자리에 가까워지면 자동 스크롤 */
    const EDGE = 90, MAX_SPEED = 18;
    let dragY = null, dragTime = 0, scrollTimer = null;
    function stopAutoScroll() {
      if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
      dragY = null;
    }
    function startAutoScroll(y) {
      stopAutoScroll(); dragY = y; dragTime = Date.now();
      scrollTimer = setInterval(() => {
        if (dragY === null || Date.now() - dragTime > 1000) { stopAutoScroll(); return; }
        const height = window.innerHeight;
        if (dragY < EDGE) window.scrollBy(0, -Math.max(1, Math.ceil((EDGE - dragY) / EDGE * MAX_SPEED)));
        else if (dragY > height - EDGE) window.scrollBy(0, Math.max(1, Math.ceil((dragY - (height - EDGE)) / EDGE * MAX_SPEED)));
      }, 16);
    }
    document.addEventListener('dragover',event => { if (scrollTimer) { dragY = event.clientY; dragTime = Date.now(); } });
    document.addEventListener('dragend',stopAutoScroll);
    document.addEventListener('drop',stopAutoScroll);

    function showMessage(message) { document.querySelector('#message').textContent = message; }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch { showMessage('이 브라우저에서는 저장하지 못했어요. 현재 화면에서 확인한 내용과 다시 열어 확인한 내용을 구분해 주세요.'); }
    }
    function countOf(tier) { return state.items.filter(item => item.tier === tier).length; }
    function matches(item) {
      if (!query) return true;
      const word = query.toLowerCase();
      return item.title.toLowerCase().includes(word) || (searchMemo && (item.memo || '').toLowerCase().includes(word));
    }
    function move(id,tier) {
      stopAutoScroll();
      const item = state.items.find(item => item.id === id);
      if (!item || !LEVELS.includes(tier)) return;
      item.tier = tier; selected = null; save(); render();
      showMessage((item.title || '영화') + '를 옮겼어요.');
    }

    /* 카드 아래 메모: 평소에는 메모(또는 '+ 메모') 버튼, 누르면 그 자리에서 입력창으로 바뀜 */
    function memoCell(id) { return [...document.querySelectorAll('.cell')].find(cell => cell.dataset.cell === id); }
    function focusEditor() {
      const input = document.querySelector('.memo-input');
      if (input) { input.focus(); input.setSelectionRange(input.value.length,input.value.length); }
    }
    function fillMemoArea(cell,item) {
      while (cell.children.length > 1) cell.lastChild.remove();
      const editing = editingId === item.id;
      cell.classList.toggle('editing',editing);
      cell.firstChild.draggable = !editing;
      const name = item.title || '영화';
      if (editing) {
        const input = document.createElement('input');
        input.className = 'memo-input'; input.maxLength = 40; input.value = editDraft;
        input.placeholder = '한 줄 메모'; input.autocomplete = 'off';
        input.setAttribute('aria-label',name + ' 한 줄 메모');
        const counter = document.createElement('span'); counter.className = 'memo-count'; counter.setAttribute('aria-hidden','true');
        const updateCounter = () => { counter.textContent = input.value.length + '/40'; counter.classList.toggle('full',input.value.length >= 40); };
        updateCounter();
        input.addEventListener('input',() => { editDraft = input.value; updateCounter(); });
        input.addEventListener('keydown',event => {
          if (event.isComposing || event.keyCode === 229) return;
          if (event.key === 'Enter') { event.preventDefault(); endEdit(true,true); }
          else if (event.key === 'Escape') { event.preventDefault(); endEdit(false,true); }
        });
        input.addEventListener('blur',() => endEdit(true,false));
        cell.append(input,counter);
      } else {
        const button = document.createElement('button');
        const expanded = expandedIds.has(item.id);
        button.type = 'button'; button.className = item.memo ? 'memo' + (expanded ? ' expanded' : '') : 'memo-add';
        button.dataset.memoId = item.id;
        if (item.memo) {
          const text = document.createElement('span'); text.className = 'memo-text'; text.textContent = item.memo;
          button.append(text); button.title = item.memo;
        } else button.textContent = '+ 메모';
        button.setAttribute('aria-label',item.memo ? name + ' 메모 편집: ' + item.memo : name + ' 메모 추가');
        button.addEventListener('click',event => { event.stopPropagation(); startEdit(item.id); });
        cell.append(button);
        if (item.memo) {
          /* 긴 메모는 3줄까지만 보이고, 잘린 경우에만 '펼치기' 버튼이 나타남 */
          const toggle = document.createElement('button');
          toggle.type = 'button'; toggle.className = 'memo-toggle'; toggle.hidden = true;
          toggle.textContent = expanded ? '접기' : '펼치기';
          toggle.setAttribute('aria-label',name + ' 메모 ' + (expanded ? '접기' : '펼치기'));
          toggle.addEventListener('click',event => {
            event.stopPropagation();
            if (expandedIds.has(item.id)) expandedIds.delete(item.id); else expandedIds.add(item.id);
            fillMemoArea(cell,item);
            cell.querySelector('.memo-toggle')?.focus({ preventScroll: true });
          });
          cell.append(toggle);
          if (cell.isConnected) measureClamp(cell);
        }
      }
    }
    function measureClamp(cell) {
      const text = cell.querySelector('.memo-text'), toggle = cell.querySelector('.memo-toggle');
      if (!text || !toggle) return;
      toggle.hidden = !(cell.querySelector('.memo.expanded') || text.scrollHeight > text.clientHeight + 1);
    }
    function markAllClamped() { document.querySelectorAll('.cell').forEach(measureClamp); }
    window.addEventListener('resize',markAllClamped);
    function startEdit(id) {
      if (editingId && editingId !== id) endEdit(true,false);
      const item = state.items.find(item => item.id === id);
      if (!item) return;
      editingId = id; editDraft = item.memo || '';
      const cell = memoCell(id);
      if (cell) fillMemoArea(cell,item);
      focusEditor();
    }
    function endEdit(commit,refocus) {
      if (editingId === null) return;
      const id = editingId, draft = editDraft.trim();
      editingId = null; editDraft = '';
      const item = state.items.find(item => item.id === id);
      if (!item) return;
      let changed = false;
      if (commit && draft !== (item.memo || '')) {
        if (draft) item.memo = draft; else delete item.memo;
        save(); changed = true; showMessage(draft ? '메모를 저장했어요.' : '메모를 지웠어요.');
      }
      const cell = memoCell(id);
      if (cell) {
        fillMemoArea(cell,item);
        if (refocus) cell.querySelector('[data-memo-id]')?.focus();
      }
      if (changed && searchMemo && query) render();
    }

    function card(item,index) {
      const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.cell = item.id;
      const element = document.createElement('button');
      element.type = 'button'; element.className = 'card'; element.draggable = true;
      element.textContent = item.title || ' '; element.dataset.id = item.id;
      element.style.backgroundColor = COLORS[index % COLORS.length];
      element.setAttribute('aria-label',item.title || '영화 카드');
      element.setAttribute('aria-pressed',String(selected === item.id));
      element.addEventListener('click',event => {
        event.stopPropagation(); selected = selected === item.id ? null : item.id; render();
        showMessage(selected ? (item.title || '영화') + '를 선택했어요.' : '선택을 해제했어요.');
      });
      element.addEventListener('dragstart',event => { event.dataTransfer.setData('text/plain',item.id); startAutoScroll(event.clientY); });
      element.addEventListener('keydown',event => { if (event.key === 'F2') { event.preventDefault(); startEdit(item.id); } });
      cell.append(element);
      fillMemoArea(cell,item);
      return cell;
    }
    function wireDrop(element,tier) {
      element.addEventListener('dragover',event => { event.preventDefault(); element.closest('.row')?.classList.add('over'); });
      element.addEventListener('dragleave',() => element.closest('.row')?.classList.remove('over'));
      element.addEventListener('drop',event => { event.preventDefault(); move(event.dataTransfer.getData('text/plain'),tier); });
      element.onclick = () => { if (selected) move(selected,tier); };
    }
    /* 화면을 다시 그려도 키보드 포커스가 사라지지 않도록, 포커스된 카드·메모 버튼·등급 글자를 기억했다가 복원 */
    function focusKey(el) {
      if (!el || !el.classList) return null;
      if (el.classList.contains('card')) return 'c:' + el.dataset.id;
      if (el.dataset.memoId) return 'm:' + el.dataset.memoId;
      if (el.classList.contains('label') && el.parentElement) return 'l:' + el.parentElement.className.split(' ')[1];
      return null;
    }
    function findByKey(key) {
      if (!key) return null;
      const kind = key[0], value = key.slice(2);
      if (kind === 'c') return [...document.querySelectorAll('.card')].find(el => el.dataset.id === value);
      if (kind === 'm') return [...document.querySelectorAll('[data-memo-id]')].find(el => el.dataset.memoId === value);
      return [...document.querySelectorAll('.label')].find(el => el.parentElement.classList.contains(value));
    }
    function render() {
      const keep = focusKey(document.activeElement);
      const tiers = document.querySelector('#tiers'); tiers.replaceChildren();
      for (const tier of LEVELS.filter(value => value !== 'pool')) {
        const row = document.createElement('div'); row.className = 'row ' + tier;
        const label = document.createElement('button'); label.type = 'button'; label.className = 'label';
        label.textContent = tier; label.setAttribute('aria-label',tier + '등급으로 옮기기, 영화 ' + countOf(tier) + '개');
        const tierCount = document.createElement('span'); tierCount.className = 'count'; tierCount.textContent = countOf(tier) + '개';
        label.append(tierCount);
        label.addEventListener('click',() => { if (selected) move(selected,tier); else showMessage('먼저 영화 카드를 선택해 주세요.'); });
        
        const drop = document.createElement('div'); drop.className = 'drop'; drop.dataset.tier = tier;
        state.items.forEach((item,index) => { if (item.tier === tier && matches(item)) drop.append(card(item,index)); });
        wireDrop(drop,tier); row.append(label,drop); tiers.append(row);
      }
      const pool = document.querySelector('#pool'); pool.replaceChildren();
      state.items.forEach((item,index) => { if (item.tier === 'pool' && matches(item)) pool.append(card(item,index)); });
      const total = state.items.length, undecided = countOf('pool');
      document.querySelector('#summary').textContent = '전체 영화 ' + total + '개 · 등급 정함 ' + (total - undecided) + '개 · 아직 안 정함 ' + undecided + '개';
      document.querySelector('#pool-label').textContent = '아직 안 정한 영화 (' + undecided + '개)';
      const result = document.querySelector('#search-result');
      if (query) {
        const found = state.items.filter(matches).length;
        result.textContent = found ? '“' + query + '” 검색 결과 ' + found + '개' + (searchMemo ? ' (제목·메모)' : '') : '“' + query + '”에 해당하는 영화가 없어요.';
      } else result.textContent = '';
      markAllClamped();
      if (editingId) focusEditor();
      else findByKey(keep)?.focus({ preventScroll: true });
    }
    /* 검색창: 평소에는 숨기고 '검색' 버튼으로 열고 닫음. 닫으면 검색어를 비워 전체 목록을 보여 줌 */
    function setSearchOpen(open,skipRender) {
      const panel = document.querySelector('#search-panel'), input = document.querySelector('#search');
      panel.hidden = !open;
      document.querySelector('#search-toggle').setAttribute('aria-expanded',String(open));
      if (open) { input.focus(); return; }
      query = ''; input.value = ''; searchMemo = false; document.querySelector('#search-memo').checked = false;
      if (!skipRender) render();
    }
    /* 목록 내보내기: 검색 필터와 관계없이 전체 영화를 등급별로 정리한 텍스트를 복사하거나 txt 파일로 저장 */
    function buildText() {
      const lines = ['내 영화 티어리스트',''];
      for (const tier of LEVELS) {
        const items = state.items.filter(item => item.tier === tier);
        lines.push((tier === 'pool' ? '아직 안 정한 영화' : tier + ' 등급') + ' (' + items.length + '개)');
        if (items.length) items.forEach(item => lines.push('- ' + item.title + (item.memo ? ' — ' + item.memo : '')));
        else lines.push('- (없음)');
        lines.push('');
      }
      return lines.join('\n').trimEnd() + '\n';
    }
    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
      } catch {}
      const before = document.activeElement;
      try {
        const area = document.createElement('textarea');
        area.value = text; area.setAttribute('readonly',''); area.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.append(area); area.select();
        const done = document.execCommand('copy');
        area.remove(); before?.focus?.({ preventScroll: true });
        return done;
      } catch { return false; }
    }
    function downloadText(text) {
      const blob = new Blob(['﻿' + text],{ type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = '영화_티어리스트.txt';
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url),1000);
    }
    document.querySelector('#export-copy').addEventListener('click',async () => {
      const done = await copyText(buildText());
      showMessage(done ? '목록을 복사했어요. 원하는 곳에 붙여 넣어 주세요.' : '이 브라우저에서는 복사하지 못했어요. ‘txt 저장’을 이용해 주세요.');
    });
    document.querySelector('#export-save').addEventListener('click',() => {
      try { downloadText(buildText()); showMessage('텍스트 파일 저장을 시작했어요. 브라우저의 다운로드 목록을 확인해 주세요.'); }
      catch { showMessage('이 브라우저에서는 파일로 저장하지 못했어요. ‘목록 복사’를 이용해 주세요.'); }
    });
    wireDrop(document.querySelector('#pool'),'pool');
    document.querySelector('#pool-label').addEventListener('click',() => { if (selected) move(selected,'pool'); else showMessage('먼저 영화 카드를 선택해 주세요.'); });
    document.querySelector('#search-toggle').addEventListener('click',() => setSearchOpen(document.querySelector('#search-panel').hidden));
    document.querySelector('#search').addEventListener('input',event => { query = event.target.value.trim(); render(); });
    document.querySelector('#search-memo').addEventListener('change',event => { searchMemo = event.target.checked; render(); });
    document.querySelector('#add-form').addEventListener('submit',event => {
      event.preventDefault(); const input = document.querySelector('#title'); const title = input.value.trim();
      if (!title) { showMessage('영화 제목을 입력해 주세요.'); input.focus(); return; }
      if (state.items.some(item => item.title === title)) { showMessage('이미 있는 영화 제목이에요. 다른 제목을 넣어 주세요.'); return; }
      state.items.push({ id: 'm' + state.nextId++, title, tier: 'pool' });
      query = ''; document.querySelector('#search').value = '';
      save(); render(); input.value = ''; showMessage('영화를 추가했어요.'); input.focus();
    });
    document.querySelector('#reset').addEventListener('click',() => {
      stopAutoScroll();
      state = initial(); selected = null; editingId = null; editDraft = ''; expandedIds.clear(); setSearchOpen(false,true);
      document.querySelector('#title').value = ''; save(); render(); showMessage('처음 목록으로 돌아왔어요.');
    });
    render();
  </script>
</body>
</html>
